version: "3.8"

services:
  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shapewear
    volumes:
      - pgdata:/var/lib/postgresql/data

  online-payment:
    container_name: online-payment
    build:
      context: .
      dockerfile: src/app/utils/Dockerfile
    restart: unless-stopped
    working_dir: /usr/src/app
    ports:
      - "3001:3000"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      - postgres

  pageadmin:
    container_name: pageadmin
    build:
      context: .
      dockerfile: src/app/utils/Dockerfile
    restart: unless-stopped
    working_dir: /usr/src/app
    ports:
      - "3002:3000"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      - postgres

volumes:
  pgdata:
    name: postgres-data
